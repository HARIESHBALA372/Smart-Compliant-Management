services:
  - type: web
    name: smart-complaint-api
    runtime: node
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: REDIS_ENABLED
        value: "false"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: DATABASE_URL
        fromDatabase:
          name: smart-complaint-db
          property: connectionString

databases:
  - name: smart-complaint-db
    plan: free
    databaseName: smart_complaint_app
