services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scm-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      ENVIRONMENT: production
      DATABASE_URL: sqlite:////app/data/complaints.db
      JWT_SECRET: change_this_secret_to_a_long_random_string_in_prod
      JWT_EXPIRES_DAYS: 7
      CLIENT_URL: http://localhost:3000,http://localhost:5173
      UPLOAD_DIR: /app/uploads
      ML_SERVICE_URL: http://localhost:8000
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/api/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  backend_data:
  backend_uploads: