services:
  postgres:
    image: postgres:16-alpine
    container_name: scm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_complaint_app
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d smart_complaint_app']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scm-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smart_complaint_app
      REDIS_ENABLED: 'true'
      REDIS_CONNECTION_STRING: redis://redis:6379
      JWT_SECRET: change_this_secret_to_a_long_random_string_in_prod
      JWT_EXPIRES_IN: 7d
      JWT_ISSUER: smart-complaint-api
      JWT_AUDIENCE: smart-complaint-app
      CLIENT_URL: http://localhost:3000
      UPLOAD_DIR: ./uploads
    ports:
      - '5000:5000'
    volumes:
      - uploads_data:/app/uploads
    command: >
      sh -c "npx prisma db push --skip-generate
      && node dist/server.js"

volumes:
  postgres_data:
  redis_data:
  uploads_data: