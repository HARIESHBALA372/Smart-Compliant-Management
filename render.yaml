services:
  # 1. Python FastAPI Backend API
  - type: web
    name: smart-complaint-backend
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./complaints.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CLIENT_URL
        value: https://*.vercel.app,http://localhost:3000

  # 2. Python ML Microservice
  - type: web
    name: smart-complaint-ml
    runtime: python
    region: oregon
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_ENV
        value: production
