services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: scm-ml-service
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      APP_ENV: production
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - scm-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scm-backend
    restart: unless-stopped
    depends_on:
      ml-service:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      ENVIRONMENT: production
      DATABASE_URL: sqlite:////app/data/complaints.db
      UPLOAD_DIR: /app/uploads
      ML_SERVICE_URL: http://ml-service:8000
      JWT_SECRET: production_secret_change_me_to_a_random_sha256_key
      JWT_EXPIRES_DAYS: 7
      CLIENT_URL: http://localhost:3000,http://localhost:80,http://localhost
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/api/health', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - scm-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_ML_API_URL: http://localhost:8000
        VITE_WS_URL: /ws
    container_name: scm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3000:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://127.0.0.1/health || exit 1']
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - scm-network

volumes:
  backend_data:
  backend_uploads:

networks:
  scm-network:
    driver: bridge
